name: Quality gate

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - feature/multiprovider-and-polish
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install debugpy (Python DAP adapter)
        run: python -m pip install debugpy

      - name: Download js-debug DAP adapter (pinned release + sha256)
        shell: bash
        run: |
          mkdir -p debug-adapters
          curl -fsSL -o js-debug-dap.tar.gz \
            https://github.com/microsoft/vscode-js-debug/releases/download/v1.117.0/js-debug-dap-v1.117.0.tar.gz
          echo "ad8d04ede9d4b75cc290fd5438a65047a06f786d04f604b6112485b36f090772  js-debug-dap.tar.gz" | sha256sum -c -
          tar -xzf js-debug-dap.tar.gz -C debug-adapters
          test -f debug-adapters/js-debug/src/dapDebugServer.js

      - name: Validate workflow YAML
        run: dart run tool/check_workflows.dart

      - name: Analyze
        run: flutter analyze

      - name: Test repository-tool source fallback
        run: flutter test --no-pub test/check_tag_sync_test.dart

      - name: Precompile repository tools
        shell: bash
        run: bash tool/build_tools.sh

      - name: Test fast suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          $timer = [Diagnostics.Stopwatch]::StartNew()
          flutter test --no-pub --exclude-tags integration --exclude-tags slow --concurrency=4
          $testExit = $LASTEXITCODE
          $timer.Stop()
          "fast_seconds=$([math]::Round($timer.Elapsed.TotalSeconds, 1))" |
            Tee-Object -FilePath test-results/fast-duration.txt
          if ($testExit -ne 0) { exit $testExit }

      - name: Test slow suite
        shell: pwsh
        env:
          YOUNZCODE_JS_DEBUG: ${{ github.workspace }}/debug-adapters/js-debug/src/dapDebugServer.js
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          flutter test --no-pub --tags slow --concurrency=1
          $testExit = $LASTEXITCODE
          $timer.Stop()
          "slow_seconds=$([math]::Round($timer.Elapsed.TotalSeconds, 1))" |
            Tee-Object -FilePath test-results/slow-duration.txt
          if ($testExit -ne 0) { exit $testExit }

      - name: Publish test timing summary
        if: always()
        shell: pwsh
        run: |
          "## Test durations" >> $env:GITHUB_STEP_SUMMARY
          Get-Content test-results/*-duration.txt -ErrorAction SilentlyContinue |
            ForEach-Object { "- ``$_``" >> $env:GITHUB_STEP_SUMMARY }

      - name: Upload test timing artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-durations
          path: test-results/*-duration.txt
          if-no-files-found: warn
